name: Publier une version Windows

# Construit l'installeur signé, crée la release GitHub « vX.Y.Z » et le fichier
# latest.json que l'application lit pour se mettre à jour.
# La version vient de src-tauri/tauri.conf.json : l'augmenter avant chaque publication.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: |
          cargo test -p apex-core
          cargo test -p apex-companion
          npm test

      - name: Construire et signer l'installeur
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Publier la release et latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          EXE=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          if [ ! -f "$EXE.sig" ]; then
            echo "::error::Installeur non signé : le secret TAURI_SIGNING_PRIVATE_KEY est absent ou invalide."
            exit 1
          fi
          mkdir -p release
          FILE="ApexCompanion_${VERSION}_x64-setup.exe"
          cp "$EXE" "release/$FILE"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${FILE}"
          SIG_PATH="$EXE.sig" URL="$URL" VERSION="$VERSION" node -e '
            const fs = require("fs");
            const m = {
              version: process.env.VERSION,
              notes: "",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(process.env.SIG_PATH, "utf8").trim(), url: process.env.URL } },
            };
            fs.writeFileSync("release/latest.json", JSON.stringify(m, null, 2));'
          cat release/latest.json
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::La version $VERSION est déjà publiée : augmente le numéro de version."
            exit 1
          fi
          gh release create "v$VERSION" "release/$FILE" release/latest.json \
            --title "Apex Companion v$VERSION" \
            --notes "Première installation : télécharge **$FILE** ci-dessous et lance-le. Si l'application est déjà installée (v0.3.0 ou plus), elle te proposera cette mise à jour au démarrage."

      # Copie de secours, téléchargeable depuis l'onglet Actions.
      - uses: actions/upload-artifact@v4
        with:
          name: Apex-Companion-Windows
          path: release/*.exe
          if-no-files-found: error
