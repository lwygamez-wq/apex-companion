[workspace]
resolver = "2"
members = ["crates/apex-core", "src-tauri"]
# `cargo test -p apex-core` fonctionne sans les dépendances système de Tauri (WebView2 / webkit).
default-members = ["crates/apex-core"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"
authors = ["Alex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
